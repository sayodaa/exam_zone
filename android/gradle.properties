org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=240m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Reduce parallel workers to lower memory pressure on Windows
org.gradle.workers.max=1
# Run Kotlin compilation in-process to avoid daemon connection/memory issues
kotlin.compiler.execution.strategy=in-process
# Apply smaller heap and disable ParallelGC specifically for Kotlin daemon
kotlin.daemon.jvm.options=-Xmx1024m,-XX:-UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
